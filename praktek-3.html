<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kartu produk</title>
    <link rel="stylesheet" href="style-p3.css"
</head>
<body>
    <h1>Daftar Produk</h1>
    <div class="produk-container">
        <div class="kartu-produk">
            <h2>Donat Cokelat</h2>
            <p>Donat lembut dengan topik cokelat</p>
            <h3>Rp 8.000</h3>
        </div>
        <div class="kartu-produk">
            <h2>Notebook</h2>
            <p>Buku catatan dengan desain menarik</p>
            <h3>Rp 15.000</h3>
        </div>
        <div class="kartu-produk">
            <h2>Botol Minum</h2>
            <p>Botol minum praktis untuk sehari-hari</p>
            <h3>Rp 25.000</h3>
        </div>
    </div>
</body>
</html>
